<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profe IA 593</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Renderizado seguro de Markdown + fórmulas LaTeX para las respuestas del Profe IA -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root{
      --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --blue:#2563EB;
      --blue2:#1D4ED8; --violet:#7C3AED; --bg:#F8FAFC; --white:#FFF;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    .app{height:100%;display:flex;flex-direction:column;min-height:0}
    .context{
      display:flex;align-items:center;gap:8px;padding:9px 12px;background:#EFF6FF;
      border-bottom:1px solid #DBEAFE;color:#1E40AF;font-size:11px;font-weight:750;
    }
    .context i{color:var(--blue)}
    #context-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .messages{flex:1;min-height:0;overflow:auto;padding:15px 14px 20px;scroll-behavior:smooth}
    .welcome{
      border:1px solid var(--line);background:#FFF;border-radius:18px;padding:14px 15px;
      box-shadow:0 8px 26px rgba(15,23,42,.05);margin-bottom:14px;
    }
    .welcome strong{display:block;font-size:14px;margin-bottom:4px}
    .welcome p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .msg{display:flex;margin:10px 0}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:90%;padding:10px 12px;border-radius:15px;font-size:13px;line-height:1.58;word-break:break-word}
    .msg.user .bubble{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#FFF;border-bottom-right-radius:5px;white-space:pre-wrap}
    .msg.ai .bubble{background:#FFF;border:1px solid var(--line);box-shadow:0 6px 18px rgba(15,23,42,.04);border-bottom-left-radius:5px;white-space:normal}

    /* Markdown del Profe IA */
    .msg.ai .bubble p{margin:.35em 0 .72em}
    .msg.ai .bubble p:first-child{margin-top:0}
    .msg.ai .bubble p:last-child{margin-bottom:0}
    .msg.ai .bubble h1,.msg.ai .bubble h2,.msg.ai .bubble h3,.msg.ai .bubble h4{
      margin:.9em 0 .42em;line-height:1.25;color:#0F172A;font-weight:850
    }
    .msg.ai .bubble h1{font-size:17px}.msg.ai .bubble h2{font-size:16px}.msg.ai .bubble h3{font-size:14.5px}.msg.ai .bubble h4{font-size:13.5px}
    .msg.ai .bubble ul,.msg.ai .bubble ol{margin:.42em 0 .75em;padding-left:1.35em}
    .msg.ai .bubble li{margin:.22em 0}
    .msg.ai .bubble strong{font-weight:850}
    .msg.ai .bubble blockquote{margin:.65em 0;padding:.55em .75em;border-left:3px solid #60A5FA;background:#EFF6FF;border-radius:0 9px 9px 0}
    .msg.ai .bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#F1F5F9;padding:.08em .3em;border-radius:5px;font-size:.92em}
    .msg.ai .bubble pre{overflow:auto;background:#0F172A;color:#E2E8F0;padding:10px;border-radius:10px;margin:.7em 0}
    .msg.ai .bubble pre code{background:transparent;color:inherit;padding:0}
    .msg.ai .bubble table{width:100%;border-collapse:collapse;margin:.7em 0;font-size:12px}
    .msg.ai .bubble th,.msg.ai .bubble td{border:1px solid #E2E8F0;padding:6px 7px;text-align:left;vertical-align:top}
    .msg.ai .bubble th{background:#F8FAFC}

    /* MathJax: fórmulas legibles y sin salirse del chat */
    .msg.ai .bubble mjx-container{max-width:100%;font-size:108% !important}
    .msg.ai .bubble mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:.7em 0 !important;padding:3px 0}

    .typing{color:var(--muted);font-style:italic}
    .composer{padding:11px;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
    .box{display:flex;gap:8px;align-items:flex-end;background:#FFF;border:1px solid #CBD5E1;border-radius:16px;padding:7px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
    textarea{flex:1;resize:none;border:0;outline:0;max-height:130px;min-height:42px;padding:10px 9px;font:inherit;font-size:13px;line-height:1.45;color:var(--ink);background:transparent}
    button{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;color:#FFF;background:linear-gradient(135deg,var(--blue),var(--violet));cursor:pointer;font-size:15px;box-shadow:0 8px 20px rgba(37,99,235,.18)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hint{margin:6px 3px 0;color:#94A3B8;font-size:10px;line-height:1.35}
    .error{color:#B91C1C}
  </style>
</head>
<body>
<div class="app">
  <div class="context"><i class="fas fa-location-dot"></i><span id="context-text">Aula virtual</span></div>
  <main class="messages" id="messages">
    <div class="welcome">
      <strong><i class="fas fa-chalkboard-user" style="color:#2563EB"></i> Profe IA 593</strong>
      <p>Pregúntame sobre el tema que estás estudiando. Puedo explicarte conceptos, darte ejemplos y ayudarte a razonar paso a paso.</p>
    </div>
  </main>
  <footer class="composer">
    <div class="box">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Escribe tu pregunta..."></textarea>
      <button id="send" type="button" aria-label="Enviar"><i class="fas fa-paper-plane"></i></button>
    </div>
    <div class="hint" id="status">La clave de Groq permanece únicamente en Cloudflare Worker.</div>
  </footer>
</div>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
