<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profe IA 593</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root{
      --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --blue:#2563EB;
      --blue2:#1D4ED8; --violet:#7C3AED; --bg:#F8FAFC; --white:#FFF;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    .app{height:100%;display:flex;flex-direction:column;min-height:0}
    .context{
      display:flex;align-items:center;gap:8px;padding:9px 12px;background:#EFF6FF;
      border-bottom:1px solid #DBEAFE;color:#1E40AF;font-size:11px;font-weight:750;
    }
    .context i{color:var(--blue)}
    #context-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .messages{flex:1;min-height:0;overflow:auto;padding:15px 14px 20px;scroll-behavior:smooth}
    .welcome{
      border:1px solid var(--line);background:#FFF;border-radius:18px;padding:14px 15px;
      box-shadow:0 8px 26px rgba(15,23,42,.05);margin-bottom:14px;
    }
    .welcome strong{display:block;font-size:14px;margin-bottom:4px}
    .welcome p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
    .msg{display:flex;margin:10px 0}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:88%;padding:10px 12px;border-radius:15px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .msg.user .bubble{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#FFF;border-bottom-right-radius:5px}
    .msg.ai .bubble{background:#FFF;border:1px solid var(--line);box-shadow:0 6px 18px rgba(15,23,42,.04);border-bottom-left-radius:5px}
    .typing{color:var(--muted);font-style:italic}
    .composer{padding:11px;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
    .box{display:flex;gap:8px;align-items:flex-end;background:#FFF;border:1px solid #CBD5E1;border-radius:16px;padding:7px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
    textarea{flex:1;resize:none;border:0;outline:0;max-height:130px;min-height:42px;padding:10px 9px;font:inherit;font-size:13px;line-height:1.45;color:var(--ink);background:transparent}
    button{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;color:#FFF;background:linear-gradient(135deg,var(--blue),var(--violet));cursor:pointer;font-size:15px;box-shadow:0 8px 20px rgba(37,99,235,.18)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hint{margin:6px 3px 0;color:#94A3B8;font-size:10px;line-height:1.35}
    .error{color:#B91C1C}
  </style>
</head>
<body>
<div class="app">
  <div class="context"><i class="fas fa-location-dot"></i><span id="context-text">Aula virtual</span></div>
  <main class="messages" id="messages">
    <div class="welcome">
      <strong><i class="fas fa-chalkboard-user" style="color:#2563EB"></i> Profe IA 593</strong>
      <p>Pregúntame sobre el tema que estás estudiando. Puedo explicarte conceptos, darte ejemplos y ayudarte a razonar paso a paso.</p>
    </div>
  </main>
  <footer class="composer">
    <div class="box">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Escribe tu pregunta..."></textarea>
      <button id="send" type="button" aria-label="Enviar"><i class="fas fa-paper-plane"></i></button>
    </div>
    <div class="hint" id="status">La clave de Groq permanece únicamente en Cloudflare Worker.</div>
  </footer>
</div>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
